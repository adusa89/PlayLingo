name: Jednorázová záloha klíče

# Dočasný postup: zašifruje podpisový klíč a heslo veřejným klíčem, který zadá spouštějící,
# a nabídne je ke stažení na jeden den. Rozšifrovat to jde jen odpovídajícím soukromým klíčem.
# Po stažení se tento soubor z repozitáře zase odstraní.

on:
  workflow_dispatch:
    inputs:
      verejny_klic:
        description: Veřejný klíč RSA (PEM v base64)
        required: true

permissions:
  contents: read

jobs:
  zaloha:
    runs-on: ubuntu-latest
    steps:
      - name: Zašifrovat klíč a heslo
        env:
          PLAYLINGO_KEY_BASE64: ${{ secrets.PLAYLINGO_KEY_BASE64 }}
          PLAYLINGO_KEY_PASSWORD: ${{ secrets.PLAYLINGO_KEY_PASSWORD }}
          VEREJNY: ${{ inputs.verejny_klic }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p tajne vystup
          cd tajne
          printf '%s' "$PLAYLINGO_KEY_BASE64" | tr -d ' \r\n\t' | base64 -d > playlingo.p12
          printf '%s' "$PLAYLINGO_KEY_PASSWORD" > heslo.txt
          test -s playlingo.p12 && test -s heslo.txt
          tar czf ../balik.tgz playlingo.p12 heslo.txt
          cd ..
          printf '%s' "$VEREJNY" | base64 -d > verejny.pem
          openssl rand -hex 32 > aes.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in balik.tgz -out vystup/balik.enc -pass file:aes.txt
          openssl pkeyutl -encrypt -pubin -inkey verejny.pem -pkeyopt rsa_padding_mode:oaep \
            -in aes.txt -out vystup/aes.enc
          rm -rf tajne balik.tgz aes.txt
          ls -la vystup

      - uses: actions/upload-artifact@v4
        with:
          name: zaloha-klice
          path: vystup/
          retention-days: 1
