name: Sestavit APK

on:
  push:
    # změny jen v PlayLingu pro PC (sestavuje pc.yml) a v návrzích APK nemění
    paths-ignore:
      - "pc/**"
      - "navrhy/**"
      - "server/**"
      - ".github/workflows/pc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle     # knihovny se nestahují při každém běhu znovu

      - name: Nástroje pro nativní část (spojení s PlayStationem)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler python3-protobuf ninja-build
          pip3 install --user --break-system-packages protobuf grpcio-tools || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: Testy logiky
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

      - name: Sestavení APK pro televize (ARM)
        env:
          # Stálý podpisový klíč (soubor p12 v kódování base64) a jeho heslo. Jsou jen v tajných
          # údajích repozitáře, nikdy v repozitáři samotném; bez nich se podepíše dočasným klíčem.
          PLAYLINGO_KEY_BASE64: ${{ secrets.PLAYLINGO_KEY_BASE64 }}
          PLAYLINGO_KEY_PASSWORD: ${{ secrets.PLAYLINGO_KEY_PASSWORD }}
        run: |
          KLIC="$RUNNER_TEMP/playlingo.p12"
          trap 'rm -f "$KLIC"' EXIT     # klíč na stroji nezůstane, ani když sestavení spadne
          if [ -n "$PLAYLINGO_KEY_BASE64" ]; then
            printf '%s' "$PLAYLINGO_KEY_BASE64" | tr -d ' \r\n\t' | base64 -d > "$KLIC"
            export PLAYLINGO_KEY_FILE="$KLIC"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Přejmenovat APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk TestPreklad.apk
          unzip -l TestPreklad.apk | grep -E "classes.*dex|\.so$"
          unzip -l TestPreklad.apk | grep -q "lib/arm64-v8a/libchiaki-jni.so"
          unzip -l TestPreklad.apk | grep -q "lib/armeabi-v7a/libchiaki-jni.so"
          ls -la TestPreklad.apk

      - name: Kontrola podpisu
        run: |
          # Všechny verze musí mít stejný podpis, jinak je televize nenainstaluje přes starší verzi.
          # Otisk (SHA-256) certifikátu stálého klíče. Je to veřejný údaj – pozná se podle něj jen,
          # že APK podepsal správný klíč; podepsat s ním nic nejde.
          STALY=9cc0a5e6719dbe63d87bf893452e6f1205dda322d2a027f7508acf96ee38c317
          OTISK=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs TestPreklad.apk | grep -m1 "SHA-256" | grep -oE "[0-9a-f]{64}" || true)
          echo "otisk podpisu: $OTISK"
          if [ "$OTISK" = "$STALY" ]; then
            echo "stálý" > podpis.txt
          else
            echo "dočasný" > podpis.txt
            echo "::warning::APK je podepsané dočasným klíčem – nepůjde nainstalovat přes vydanou verzi. V nastavení repozitáře chybí nebo nesedí tajné údaje PLAYLINGO_KEY_BASE64 a PLAYLINGO_KEY_PASSWORD."
          fi
          cat podpis.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TestPreklad-APK
          path: |
            TestPreklad.apk
            podpis.txt

      # Rozpracované větve: APK jde do zkušebního kanálu hned, jak je sestavené a podepsané (asi 5 minut
      # od odeslání), a nečeká čtvrt hodiny na emulátory. Kanál má zapnutý jen ten, kdo verze zkouší.
      # Jak zkoušky dopadly, se do popisu vydání doplní potom (úloha „Vydat APK ke stažení“).
      # Hlavní větve se to netýká: verze pro všechny vychází dál až po úspěšné zkoušce.
      - name: Zkušební kanál hned po sestavení
        if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/zaloha-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat podpis.txt 2>/dev/null)" != "stálý" ]; then
            echo "::warning::APK není podepsané stálým klíčem, proto se do zkušebního kanálu nevydává (zůstává tam předchozí verze)."
            exit 0
          fi
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p "$RUNNER_TEMP/zkusebni"
          echo "$CODE $NAME" > "$RUNNER_TEMP/zkusebni/version.txt"
          cp TestPreklad.apk "$RUNNER_TEMP/zkusebni/PlayLingo.apk"
          gh release delete zkusebni --yes --cleanup-tag || true
          gh release create zkusebni "$RUNNER_TEMP/zkusebni/PlayLingo.apk" "$RUNNER_TEMP/zkusebni/version.txt" --target "$GITHUB_SHA" --prerelease --latest=false --title "PlayLingo – zkušební verze $NAME" --notes "Zkušební verze $NAME z větve ${GITHUB_REF#refs/heads/}. Sestavená a podepsaná stálým klíčem; zkouška v emulátoru teprve běží. Nabídne se jen tomu, kdo má v aplikaci zapnuté Zkušební verze."

      - name: Sestavení zkušební verze pro emulátor (x86)
        run: |
          ./gradlew assembleDebug --no-daemon -Pabis=x86
          cp app/build/outputs/apk/debug/app-debug.apk TestPreklad-emulator.apk
          unzip -l TestPreklad-emulator.apk | grep "\.so$"

      - uses: actions/upload-artifact@v4
        with:
          name: emulator-apk
          path: TestPreklad-emulator.apk

      # Emulátor telefonu s Androidem 14 má 64bitový procesor – potřebuje vlastní zkušební APK.
      # Když se nepovede, zkouška na Android TV běží dál (jen zkouška telefonu s Androidem 14 spadne).
      - name: Sestavení zkušební verze pro emulátor telefonu (x86_64)
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --no-daemon -Pabis=x86_64
          cp app/build/outputs/apk/debug/app-debug.apk TestPreklad-emulator64.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: emulator-apk64
          path: TestPreklad-emulator64.apk

  publish:
    name: Vydat APK ke stažení
    needs: [build, emulator]
    # hlavní větev → „latest“ pro všechny; zálohy (větve zaloha-…) → jen vydání pod číslem verze;
    # ostatní větve → zkušební kanál „zkusebni“ (jen pro ty, kdo si ho v aplikaci zapnou)
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: TestPreklad-APK
      - name: Vydat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "$CODE $NAME" > version.txt
          cat version.txt
          # nový název souboru; starý zůstává, aby fungoval odkaz ve starších verzích aplikace
          cp TestPreklad.apk PlayLingo.apk
          # Vydává se jen APK podepsané stálým klíčem. Jinak by ho televize nenainstalovala přes
          # vydanou verzi a každý, kdo by si ho nahrál ručně, by pak nemohl aktualizovat.
          if [ "$(cat podpis.txt 2>/dev/null)" != "stálý" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::APK není podepsané stálým klíčem, proto se nevydává. Zkontroluj tajné údaje PLAYLINGO_KEY_BASE64 a PLAYLINGO_KEY_PASSWORD."
              exit 1
            fi
            echo "::warning::APK není podepsané stálým klíčem, proto se do zkušebního kanálu nevydává (zůstává tam předchozí verze)."
            exit 0
          fi
          PODPIS="Podpis: $(cat podpis.txt)."
          # Rozpracované větve: APK už ve zkušebním kanálu je (vyšlo hned po sestavení). Tady se jen
          # do popisu doplní, že prošlo zkouškou – pokud mezitím kanál nepřepsalo novější odeslání.
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "${GITHUB_REF#refs/heads/zaloha-}" = "$GITHUB_REF" ]; then
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/zkusebni" --jq .object.sha 2>/dev/null)" = "$GITHUB_SHA" ]; then
              gh release edit zkusebni --notes "Zkušební verze $NAME z větve ${GITHUB_REF#refs/heads/}, vyzkoušená v emulátoru Android TV. Nabídne se jen tomu, kdo má v aplikaci zapnuté Zkušební verze. $PODPIS"
            else
              echo "Zkušební kanál už patří jinému odeslání – popis se nemění."
            fi
            exit 0
          fi
          # Aplikace pro TV Samsung jako samostatný soubor (od 0.97.52): bere si ho Apps2Samsung ze zdroje
          # github.com/…/releases/tag/latest (průvodce Samsung, core/SamsungSetup.kt). Je to přesně ten
          # nepodepsaný .wgt, který je v APK – podpis pro konkrétní TV přidá až Apps2Samsung.
          unzip -p PlayLingo.apk assets/samsung/receiver.wgt > PlayLingo-Samsung.wgt
          if [ "$(head -c 2 PlayLingo-Samsung.wgt)" != "PK" ]; then echo "::error::V APK chybí aplikace pro TV Samsung (assets/samsung/receiver.wgt)."; exit 1; fi
          # Každá verze zůstává ke stažení natrvalo pod vlastním číslem (záloha, ke které se dá vrátit).
          cp PlayLingo.apk "PlayLingo-$NAME.apk"
          gh release view "v$NAME" >/dev/null 2>&1 || gh release create "v$NAME" "PlayLingo-$NAME.apk" PlayLingo-Samsung.wgt --target "$GITHUB_SHA" --latest=false --title "PlayLingo $NAME" --notes "Verze $NAME, sestavená a vyzkoušená v emulátoru Android TV. $PODPIS"
          # „nejnovější“ se mění jen z hlavní větve
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then exit 0; fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PlayLingo.apk TestPreklad.apk version.txt PlayLingo-Samsung.wgt --title "PlayLingo – nejnovější APK" --notes "Automaticky sestaveno z posledního kódu a vyzkoušeno v emulátoru Android TV (Android 9, 11, 13, 14). Spojení s PlayStationem používá otevřenou knihovnu chiaki-ng (AGPL-3.0); zdrojový kód je v tomto repozitáři. $PODPIS"

  emulator:
    name: Emulátor Android TV (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50     # emulátor se občas zasekne – ať neblokuje vydání celé hodiny
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30, 33, 34]   # Android 9, 11, 13, 14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: emulator-apk

      - name: Povolit KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Zkouška v emulátoru
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: bash ci/emulator-test.sh

      - name: Uložit výsledky
        if: always()
        run: |
          cd test-results || exit 0
          git init -q -b test-results-api${{ matrix.api }}
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Výsledky zkoušky v emulátoru"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results-api${{ matrix.api }}

      - name: Vyhodnocení
        run: |
          cat test-results/result.txt
          grep -q "^VYSLEDEK=OK" test-results/result.txt

  # Zkouška v emulátoru telefonu: pomocník, celá aplikace v různých velikostech displeje a překlad.
  # Zatím jen hlásí výsledek a vydání nezdržuje (až se ustálí, přidej ji do „needs“ u vydání).
  phone:
    name: Emulátor telefonu (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, arch: x86, artifact: emulator-apk, apk: TestPreklad-emulator.apk }         # Android 11
          - { api: 34, arch: x86_64, artifact: emulator-apk64, apk: TestPreklad-emulator64.apk }   # Android 14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Povolit KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Zkouška v emulátoru telefonu
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ matrix.apk }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          script: bash ci/phone-test.sh

      - name: Uložit výsledky
        if: always()
        run: |
          cd test-results || exit 0
          git init -q -b test-results-phone${{ matrix.api }}
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Výsledky zkoušky v emulátoru telefonu"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results-phone${{ matrix.api }}

      - name: Vyhodnocení
        run: |
          head -3 test-results/result.txt
          grep -q "^VYSLEDEK=OK" test-results/result.txt
