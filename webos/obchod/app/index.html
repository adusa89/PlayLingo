<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PlayLingo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Domů: výběr vstupu HDMI, ukázka, nápověda a přepnutí jazyka -->
<div id="domu" class="strana">
  <div class="znacka">PlayLingo</div>
  <h1 data-t="nadpis"></h1>
  <p class="popis" data-t="popis"></p>

  <p class="krok" data-t="otazka"></p>
  <div class="rada">
    <div class="tl" data-akce="hdmi" data-hdmi="1">HDMI 1</div>
    <div class="tl" data-akce="hdmi" data-hdmi="2">HDMI 2</div>
    <div class="tl" data-akce="hdmi" data-hdmi="3">HDMI 3</div>
    <div class="tl" data-akce="hdmi" data-hdmi="4">HDMI 4</div>
  </div>
  <div class="rada">
    <div class="tl mensi" data-akce="ukazka" data-t="tl_ukazka"></div>
    <div class="tl mensi" data-akce="napoveda" data-t="tl_napoveda"></div>
    <div class="tl mensi" data-akce="jazyk" data-t="tl_jazyk"></div>
  </div>
  <p class="drobne" data-t="ovladani"></p>
</div>

<!-- Hra: obraz ze vstupu HDMI a přes něj pruh s překladem -->
<div id="hra" class="strana">
  <div id="obraz"></div>
  <div id="hlaseni"></div>
</div>

<!-- Ukázka: jak překlad vypadá, bez PlayStationu i bez telefonu -->
<div id="ukazka" class="strana">
  <div class="scena">
    <div class="stitek" data-t="uk_stitek"></div>
    <div class="uk-text" data-t="uk_popis"></div>
    <div id="original"></div>
  </div>
</div>

<!-- Nápověda -->
<div id="napoveda" class="strana">
  <div class="znacka">PlayLingo</div>
  <h1 data-t="np_nadpis"></h1>
  <div class="kroky">
    <div class="bod"><i>1</i><span data-t="np_1"></span></div>
    <div class="bod"><i>2</i><span data-t="np_2"></span></div>
    <div class="bod"><i>3</i><span data-t="np_3"></span></div>
    <div class="bod"><i>4</i><span data-t="np_4"></span></div>
  </div>
  <p class="drobne" data-t="np_sony"></p>
</div>

<!-- Pruh s překladem (hra a ukázka) a tlačítko Zpět (ukázka, nápověda, při hře po pohybu ukazovátka) -->
<div id="pruh"><span id="titulek"></span></div>
<div id="zpet" class="tl vybrane" data-t="tl_zpet"></div>

<script src="app.js"></script>
</body>
</html>
